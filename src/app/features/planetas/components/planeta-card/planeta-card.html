<!-- [E21] @let: variable de la plantilla para no repetir planeta() -->
@let p = planeta();

<!-- [E22] Tarjeta de planeta para layout masonry -->
<article
  class="flex flex-col overflow-hidden rounded-xl border border-stone-200 bg-white shadow-sm transition hover:shadow-md"
>
  <div class="relative flex justify-center bg-linear-to-b from-stone-100 to-stone-50 p-4">
    <!-- [E23] (error) del img cambia el signal y el @if muestra un ícono -->
    @if (imagenFallo()) {
      <svg lucideImageOff class="my-10 size-12 text-stone-400"></svg>
    } @else {
      <img
        [src]="p.image"
        [alt]="p.name"
        loading="lazy"
        (error)="imagenFallo.set(true)"
        class="h-auto w-full object-contain"
      />
    }

    <span
      class="absolute top-3 right-3 rounded-full px-2.5 py-0.5 text-xs font-semibold shadow-xs"
      [class]="p.isDestroyed ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'"
    >
      {{ p.isDestroyed ? 'Destruido' : 'Intacto' }}
    </span>
  </div>

  <div class="flex flex-1 flex-col gap-2 p-4">
    <h3 class="text-lg font-semibold leading-tight">
      <!-- [E42] routerLink hacia el detalle del planeta -->
      <a [routerLink]="['/planetas', p.id]" class="hover:text-capsula-700 hover:underline">
        {{ p.name }}
      </a>
    </h3>

    @if (p.description) {
      <p class="line-clamp-3 text-xs leading-relaxed text-stone-600">
        {{ p.description }}
      </p>
    }

    <a
      [routerLink]="['/planetas', p.id]"
      class="mt-auto flex items-center justify-center gap-1.5 rounded-lg border border-stone-300 px-3 py-1.5 text-sm font-medium text-stone-700 transition hover:bg-stone-50 hover:text-capsula-700"
    >
      <svg lucideGlobe class="size-4"></svg>
      Ver detalles
    </a>
  </div>
</article>
